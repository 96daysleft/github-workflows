name: 'Fetch Anthropic OIDC Token'
description: 'Fetch a GitHub OIDC token and exchange it for an Anthropic access token'

inputs:
  federation-rule-id:
    description: 'Anthropic federation rule ID'
    required: true
  organization-id:
    description: 'Anthropic organization ID'
    required: true
  service-account-id:
    description: 'Anthropic service account ID'
    required: true
  workspace-id:
    description: 'Anthropic workspace ID'
    required: true

outputs:
  claude-token:
    description: 'Anthropic access token exchanged from the GitHub OIDC token'
    value: ${{ steps.exchange.outputs.claude-token }}

runs:
  using: 'composite'
  steps:
    - name: Fetch GitHub OIDC token and exchange for an Anthropic access token
      id: exchange
      uses: actions/github-script@v9
      env:
        FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
        WORKSPACE_ID: ${{ inputs.workspace-id }}
      with:
        script: |
          const jwt = await core.getIDToken('https://api.anthropic.com');
          core.setSecret(jwt);

          const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt,
              federation_rule_id: process.env.FEDERATION_RULE_ID,
              organization_id: process.env.ORGANIZATION_ID,
              service_account_id: process.env.SERVICE_ACCOUNT_ID,
              workspace_id: process.env.WORKSPACE_ID,
            }),
          });

          if (!response.ok) {
            throw new Error(`Anthropic token exchange failed: ${response.status}`);
          }

          const { access_token: token } = await response.json();
          core.setSecret(token);
          core.setOutput('claude-token', token);
