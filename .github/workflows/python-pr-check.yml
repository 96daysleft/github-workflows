name: Python PR Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      test-dependencies:
        description: 'Extra pip packages to install for the test run'
        type: string
        default: 'pytest pytest-asyncio pytest-cov'
      pytest-args:
        description: 'Additional arguments passed to pytest'
        type: string
        default: ''
      run-pr-agent:
        description: ''
        type: boolean
        default: false

permissions:
  id-token: write
  issues: write
  pull-requests: write
  contents: write

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version' 
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ${{ inputs.test-dependencies }}

      - name: Run pytest
        run: pytest ${{ inputs.pytest-args }}

      - name: Fetch Anthropic OIDC token
        if: ${{ inputs.run-pr-agent == true}}
        id: anthropic_token
        uses: ./.github/actions/anthropic-oidc-token
        with:
          federation-rule-id: ${{ secrets.FEDERATION_RULE_ID }}
          organization-id: ${{ secrets.ORGANIZATION_ID }}
          service-account-id: ${{ secrets.SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ secrets.WORKSPACE_ID }}

      - name: PR Agent action step
        if: ${{ inputs.run-pr-agent == true}}
        uses: the-pr-agent/pr-agent@aaa29921481aaa171f8b62adeeaa4fbffb3ee7e3  # main as of 2026-09-09
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-haiku-4-5-20251001"
          config.fallback_models: '["anthropic/claude-sonnet-4-5-20250929"]'
          ANTHROPIC.KEY: ${{ steps.anthropic_token.outputs.claude-token }}
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"