name: Python PR Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      test-dependencies:
        description: 'Extra pip packages to install for the test run'
        type: string
        default: 'pytest pytest-asyncio pytest-cov'
      pytest-args:
        description: 'Additional arguments passed to pytest'
        type: string
        default: ''
      run-pr-agent:
        description: ''
        type: boolean
        default: false

permissions:
  id-token: write
  issues: write
  pull-requests: write
  contents: write

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version' 
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ${{ inputs.test-dependencies }}

      - name: Run pytest
        run: pytest ${{ inputs.pytest-args }}

      - name: Fetch GitHub OIDC token and exchange for an Anthropic access token
        if: ${{ inputs.run-pr-agent == true}}
        id: anthropic_token
        uses: actions/github-script@v9
        env:
          FEDERATION_RULE_ID: ${{ secrets.FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ secrets.SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
        with:
          script: |
            const jwt = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(jwt);

            const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt,
                federation_rule_id: process.env.FEDERATION_RULE_ID,
                organization_id: process.env.ORGANIZATION_ID,
                service_account_id: process.env.SERVICE_ACCOUNT_ID,
                workspace_id: process.env.WORKSPACE_ID,
              }),
            });

            if (!response.ok) {
              throw new Error(`Anthropic token exchange failed: ${response.status}`);
            }

            const { access_token: token } = await response.json();
            core.setSecret(token);
            core.setOutput('claude-token', token);

      - name: PR Agent action step
        if: ${{ inputs.run-pr-agent == true}}
        uses: the-pr-agent/pr-agent@aaa29921481aaa171f8b62adeeaa4fbffb3ee7e3  # main as of 2026-09-09
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-haiku-4-5-20251001"
          config.fallback_models: '["anthropic/claude-sonnet-4-5-20250929"]'
          ANTHROPIC.KEY: ${{ steps.anthropic_token.outputs.claude-token }}
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"