# This workflow is managed by gh actions-lock.

name: Build Artifacts

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      registry:
        description: ""
        required: false
        type: string
        default: ghcr.io
      image-name:
        description: ""
        required: false
        type: string
        default: ${{ github.repository }}
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-artifacts:
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract and set version tag
        id: version
        run: |
          # github.ref_name is the tag name (e.g. v1.2.3) on a tag push
          VERSION="${GITHUB_REF_NAME}"
          # Remove 'v' prefix if present
          CLEAN_VERSION="${VERSION#v}"
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "FULL_TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION}"
          echo "Clean version: ${CLEAN_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools setuptools-scm

      - name: Build Python package
        run: |
          python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Create a Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.FULL_TAG }}
          name: ${{ env.FULL_TAG }}
          generate_release_notes: true
          files: dist/*
