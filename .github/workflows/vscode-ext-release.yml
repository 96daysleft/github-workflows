name: Vscode Extension Release

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      version-type:
        type: string
        description: 'The type of version to increment: major, minor, or patch'
        required: true
      extension-name:
        type: string
        description: 'File name to give the packaged .vsix (e.g. myext.vsix)'
        required: true
      publish-vsce:
        type: string
        description: 'Publish to the VS Code Marketplace when this equals the string "true"'
        required: false
        default: 'false'
      publish-vsx:
        type: string
        description: 'Publish to Open VSX when this equals the string "true"'
        required: false
        default: 'false'
    secrets:
      VSCE_PAT:
        description: 'VS Code Marketplace personal access token'
        required: false
      OVSX_PAT:
        description: 'Open VSX personal access token'
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  deployments: write

jobs:
  release:
    environment: release
    runs-on: ${{ inputs.runner }}
    env:
      EXTENSION_NAME: ${{ inputs.extension-name }}
      SBOM_NAME: sbom.cdx.json
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Verify input
        uses: actions/github-script@v9
        env:
          VERSION_TYPE: ${{ inputs.version-type }}
        with:
          script: |
            const selection = (process.env.VERSION_TYPE || '').toLowerCase();
            const options = ['patch', 'minor', 'major'];

            if (options.includes(selection)) {
              core.info(`selection ${selection} is ok`);
            } else {
              core.setFailed(`selection "${selection}" not found, must be one of ${options.join(', ')}`);
            }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup Git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git status

      - name: Install dependencies
        run: npm ci

      - name: Increment version
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version-type }}
        run: |
          npm version --no-git-tag-version "${VERSION_TYPE}" -m "Release version to v%s"
          VERSION="v$(node -p "require('./package.json').version")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "New version: ${VERSION}"
          git add package.json
          git add package-lock.json

      - name: Update Change Log
        env:
          CHANGE_LOG_FILE: "CHANGELOG.md"
        run: |
          npx auto-changelog --commit-limit false -p --output ${CHANGE_LOG_FILE}
          git add ${CHANGE_LOG_FILE}

      - name: Push commit and tag
        run: |
          git commit -m "Release version ${VERSION}"
          git push
          git tag ${VERSION}
          git push origin ${VERSION}

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Install VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libgtk-3-0t64 libgbm1 libasound2t64 libsecret-1-0

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package extension
        run: npx vsce package --out "${EXTENSION_NAME}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ env.SBOM_NAME }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: ${{ env.EXTENSION_NAME }}
          sbom-path: ${{ env.SBOM_NAME }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.EXTENSION_NAME }}

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            "${EXTENSION_NAME}" \
            "${SBOM_NAME}"

  publish:
    needs: release
    uses: ./.github/workflows/vscode-ext-publish.yml
    with:
      tag: ${{ needs.release.outputs.version }}
      runner: ${{ inputs.runner }}
      extension-name: ${{ inputs.extension-name }}
      publish-vsce: ${{ inputs.publish-vsce }}
      publish-vsx: ${{ inputs.publish-vsx }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
