name: Docker Build and Push

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        required: false
        default: 'ubuntu-latest'
      registry:
        description: 'Container registry host'
        type: string
        default: 'ghcr.io'
      image-name:
        description: 'Image name (defaults to calling repo, e.g. org/repo)'
        type: string
        default: ''
      context:
        description: 'Docker build context path'
        type: string
        default: '.'
    secrets:
      registry-password:
        description: 'Password/token for registry login (pass secrets.GITHUB_TOKEN from caller)'
        required: true

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-password }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name != '' && inputs.image-name || github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
