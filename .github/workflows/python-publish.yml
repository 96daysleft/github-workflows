name: Reusable Build Artifacts

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for building'
        type: string
        default: '3.11'
      tag-name:
        description: 'Release tag (e.g. v1.2.3). Defaults to the calling workflow ref name.'
        type: string
        default: ''

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract and set version tag
        id: version
        run: |
          VERSION="${{ inputs.tag-name != '' && inputs.tag-name || github.ref_name }}"
          CLEAN_VERSION="${VERSION#v}"
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "full_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "FULL_TAG=${VERSION}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools setuptools-scm

      - name: Build Python package
        run: |
          python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Create a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FULL_TAG }}
          name: ${{ env.FULL_TAG }}
          files: dist/*
