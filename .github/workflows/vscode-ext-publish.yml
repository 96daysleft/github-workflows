name: Publish

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      tag:
        description: 'Release tag whose .vsix asset should be published'
        required: true
        type: string
      extension-name:
        description: 'File name of the packaged .vsix asset on the release (e.g. myext.vsix)'
        required: true
        type: string
      publish-vsx:
        description: 'Publish to Open VSX when this equals the string "true"'
        required: false
        type: string
        default: 'false'
      publish-vsce:
        description: 'Publish to the VS Code Marketplace when this equals the string "true"'
        required: false
        type: string
        default: 'false'
    secrets:
      VSCE_PAT:
        description: 'VS Code Marketplace personal access token'
        required: false
      OVSX_PAT:
        description: 'Open VSX personal access token'
        required: false

permissions:
  contents: read  # download release assets

jobs:
  publish:
    environment: release
    env:
      EXTENSION_NAME: ${{ inputs.extension-name }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Download .vsix from the GitHub Release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --pattern "${EXTENSION_NAME}"
          ls -l "${EXTENSION_NAME}"

      # Both publish steps run whenever the download succeeded; each is independent,
      # so a failure in one marketplace does not stop the other. The job is failed
      # afterwards by "Report publish results" if any attempted publish failed.
      - name: Publish to VS Code Marketplace
        id: publish_vsce
        if: ${{ !cancelled() && steps.download.outcome == 'success' && inputs.publish-vsce == 'true' }}
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "${EXTENSION_NAME}" -p "${VSCE_PAT}"

      - name: Publish to Open VSX
        id: publish_ovsx
        if: ${{ !cancelled() && steps.download.outcome == 'success' && inputs.publish-vsx == 'true' }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "${EXTENSION_NAME}" -p "${OVSX_PAT}"

      - name: Report publish results
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        env:
          VSCE_OUTCOME: ${{ steps.publish_vsce.outcome }}
          OVSX_OUTCOME: ${{ steps.publish_ovsx.outcome }}
        run: |
          echo "VS Code Marketplace: ${VSCE_OUTCOME}"
          echo "Open VSX:            ${OVSX_OUTCOME}"
          if [ "${VSCE_OUTCOME}" = "failure" ] || [ "${OVSX_OUTCOME}" = "failure" ]; then
            echo "::error::One or more publish steps failed"
            exit 1
          fi
