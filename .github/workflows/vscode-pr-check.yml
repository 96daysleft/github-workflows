name: Vscode PR Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) for the workflow jobs'
        type: string
        default: 'ubuntu-latest'
      run-pr-agent:
        description: ''
        type: boolean
        default: false
    secrets:
      FEDERATION_RULE_ID:
        description: 'Anthropic federation rule ID'
        required: false
      ORGANIZATION_ID:
        description: 'Anthropic organization ID'
        required: false
      SERVICE_ACCOUNT_ID:
        description: 'Anthropic service account ID'
        required: false
      WORKSPACE_ID:
        description: 'Anthropic workspace ID'
        required: false

permissions:
  id-token: write
  issues: write
  pull-requests: write
  contents: write

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the PR branch itself (not the detached merge ref) so we can push back.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Commit package-lock.json if it changed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged"
            exit 0
          fi
          echo "package-lock.json changed - committing"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Run compile
        run: npm run compile

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libgtk-3-0t64 libgbm1 libasound2t64 libsecret-1-0

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

      - name: Fetch Anthropic OIDC token
        if: ${{ inputs.run-pr-agent == true}}
        id: anthropic_token
        uses: 96daysleft/github-workflows/.github/actions/anthropic-oidc-token@release
        with:
          federation-rule-id: ${{ secrets.FEDERATION_RULE_ID }}
          organization-id: ${{ secrets.ORGANIZATION_ID }}
          service-account-id: ${{ secrets.SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ secrets.WORKSPACE_ID }}

      - name: PR Agent action step
        if: ${{ inputs.run-pr-agent == true}}
        uses: the-pr-agent/pr-agent@aaa29921481aaa171f8b62adeeaa4fbffb3ee7e3  # main as of 2026-09-09
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-haiku-4-5-20251001"
          config.fallback_models: '["anthropic/claude-sonnet-4-5-20250929"]'
          ANTHROPIC.KEY: ${{ steps.anthropic_token.outputs.claude-token }}
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"